name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: faldyardiansyah
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#f7768e&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Push SVG ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}